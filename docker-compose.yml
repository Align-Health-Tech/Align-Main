# Local Postgres + api-server. api-server image/build will be wired once the FastAPI app exists.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: align
      POSTGRES_USER: align_owner
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "5432:5432"
    volumes:
      - align_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U align_owner -d align"]
      interval: 5s
      timeout: 5s
      retries: 5

  # api-server:
  #   build: ./apps/api-server
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     DATABASE_URL: postgresql+psycopg://align:align@postgres:5432/align
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  align_pgdata: